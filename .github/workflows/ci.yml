name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JX3_PYTHON: python
      JX3_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check publication contents
        run: python scripts/check_publication.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - name: Backend tests
        run: python -m pytest -q --basetemp=.tools/pytest-ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm run build
          npm test
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests with isolated databases
        working-directory: frontend
        run: npm run test:e2e
      - name: Validate image build
        run: docker build -t jx3-ci:check .
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Jimme/jx3-equipment-manager'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: docker-hub-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install version-check dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Refuse mismatched or existing versions
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: jimmeyoumu
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            jimmeyoumu/jx3-equipment-manager:${{ steps.release.outputs.version }}
            jimmeyoumu/jx3-equipment-manager:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
