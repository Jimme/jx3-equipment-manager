services:
  app:
    image: "jimmeyoumu/jx3-equipment-manager:${JX3_IMAGE_TAG:-stable}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${JX3_BIND_IP:-0.0.0.0}:${JX3_PORT:-8088}:8000"
    environment:
      JX3_DATA_DIR: /app/data
      JX3_APP_UID: "${JX3_UID:-10001}"
      JX3_APP_GID: "${JX3_GID:-10001}"
    volumes:
      - "${JX3_HOST_DATA_DIR:-./data}:/app/data"
    # The entrypoint prepares only this application's mount, then drops root.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
